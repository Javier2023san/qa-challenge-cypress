name: E2E Sauce Demo

on:
  push:
    paths:
      - "e2e-saucedemo/**"
      - ".github/workflows/e2e-saucedemo.yml"
  pull_request:
    paths:
      - "e2e-saucedemo/**"
      - ".github/workflows/e2e-saucedemo.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-saucedemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e-saucedemo/package-lock.json
      - run: npm ci
      # Credenciales de demo inyectadas como variables de entorno de Cypress
      - run: npm test
        env:
          CYPRESS_standardUser: standard_user
          CYPRESS_standardPassword: ${{ secrets.SAUCE_STANDARD_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e-saucedemo/cypress/screenshots
          if-no-files-found: ignore
